<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KS diagramrevision</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    .audit-variant { padding: 18px 0 28px; border-bottom: 1px solid var(--rule); }
    .audit-variant > h2 { margin: 0 0 12px; font-size: 18px; }
    .audit-variant .prompt, .audit-variant .solution { margin: 0; }
    .audit-variant svg { display: block; margin-inline: auto; }
    .audit-hidden { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden; }
    @media print {
      .audit-variant { padding: 0; border: 0; }
      .audit-variant > h2 { font-size: 11pt; }
    }
  </style>
</head>
<body>
  <div id="audit-root"></div>
  <script src="../assets/js/subject-config.js"></script>
  <script src="../assets/js/units.js"></script>
  <script src="../assets/js/expression-parser.js"></script>
  <script src="../assets/js/grading.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/timer.js"></script>
  <script src="../assets/js/exam-engine.js"></script>
  <script src="../assets/js/diagram-kit.js"></script>
  <script src="../Matematik KS2/questions/slot-5.js"></script>
  <script src="../Fysik KS1/questions/slot-1.js"></script>
  <script src="../Fysik KS1/questions/slot-2.js"></script>
  <script src="../Fysik KS1/questions/slot-3.js"></script>
  <script src="../Fysik KS1/questions/slot-4.js"></script>
  <script src="../Fysik KS1/questions/slot-5.js"></script>
  <script src="../Fysik KS1/questions.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
  (function () {
    "use strict";

    const SCREEN_MODES = ["desktop", "tablet", "mobile"];
    const VIEWPORTS = {
      desktop: [1440, 900], tablet: [768, 1024], mobile: [390, 844], print: [794, 1123]
    };

    function groups() {
      const result = [{ subject: "math", slot: 5, purpose: "prompt", questions: window.KS_MATH_SLOTS[5] }];
      [1, 2, 3, 4, 5].forEach(function (slot) {
        result.push({ subject: "physics", slot: slot, purpose: "prompt", questions: window.KS_PHYSICS_SLOTS[slot] });
      });
      [1, 4, 5].forEach(function (slot) {
        result.push({
          subject: "physics", slot: slot, purpose: "solution",
          questions: window.KS_PHYSICS_SLOTS[slot].filter(function (question) {
            return question.sourceData && question.sourceData.solutionDiagram;
          })
        });
      });
      return result;
    }

    function manifestFor(question, purpose) {
      return purpose === "solution" ? question.sourceData.solutionDiagram : question.sourceData.diagram;
    }

    function htmlFor(question, purpose) {
      return purpose === "solution" ? question.solutionHtml : question.promptHtml;
    }

    function parsedDiagram(html, manifest) {
      const template = document.createElement("template");
      template.innerHTML = html;
      const roots = Array.from(template.content.querySelectorAll("svg"));
      if (roots.length !== 1) throw new Error("diagram markup must contain exactly one SVG root");
      const svg = roots[0];
      if (svg.id !== manifest.id) throw new Error("diagram root ID does not match its manifest");
      return svg.outerHTML;
    }

    function diagramMarkup(question, purpose) {
      try {
        return parsedDiagram(htmlFor(question, purpose), manifestFor(question, purpose));
      } catch (error) {
        throw new Error(question.id + " (" + purpose + "): " + error.message);
      }
    }

    function sourceInvariants() {
      const allGroups = groups();
      const promptGroups = allGroups.filter(function (group) { return group.purpose === "prompt"; });
      const solutionGroups = allGroups.filter(function (group) { return group.purpose === "solution"; });
      const sourceEntries = promptGroups.concat(solutionGroups).flatMap(function (group) {
        return group.questions.map(function (question) {
          return { group: group, question: question, manifest: manifestFor(question, group.purpose) };
        });
      });
      const ids = new Map();
      const pairs = new Set();
      const failures = [];
      const parsedCounts = { mathPrompt: 0, physicsPrompt: 0, physicsSolution: 0 };

      sourceEntries.forEach(function (entry) {
        try {
          window.KS.diagram.validateManifest(entry.manifest);
        } catch (error) {
          failures.push(entry.question.id + ": manifest provenance/invariant: " + error.message);
        }
        const pair = entry.manifest.titleId + "\n" + entry.manifest.descriptionId;
        if (pairs.has(pair)) failures.push(entry.question.id + ": duplicate title/description pair");
        pairs.add(pair);
        entry.manifest.domIds.forEach(function (id) {
          if (ids.has(id)) failures.push(entry.question.id + ": duplicate fragment ID " + id + " (also " + ids.get(id) + ")");
          else ids.set(id, entry.question.id);
        });
        try {
          parsedDiagram(htmlFor(entry.question, entry.group.purpose), entry.manifest);
          if (entry.group.purpose === "solution") parsedCounts.physicsSolution += 1;
          else if (entry.group.subject === "math") parsedCounts.mathPrompt += 1;
          else parsedCounts.physicsPrompt += 1;
        } catch (error) {
          failures.push(entry.question.id + ": parsed root invariant: " + error.message);
        }

        if (entry.group.subject === "math" && entry.group.purpose === "prompt" && ["right-triangle", "non-right-triangle-area"].includes(entry.question.sourceData.family)) {
          const angle = entry.manifest.information.find(function (element) { return element.role === "angle"; });
          const outline = entry.manifest.geometry.find(function (element) { return element.id.endsWith("-outline"); });
          const angleLabel = entry.manifest.labels.find(function (element) { return element.id.endsWith("-angle-label"); });
          const background = entry.manifest.backgrounds.find(function (element) { return element.labelId === angleLabel.id; });
          const center = [background.x + background.width / 2, background.y + background.height / 2];
          const distance = Math.hypot(center[0] - angle.vertex[0], center[1] - angle.vertex[1]);
          if (!pointInPolygon(center, outline.points) || distance < angle.radius + 8 || distance > angle.radius + 36) {
            failures.push(entry.question.id + ": finite triangle angle label invariant failed");
          }
        }
      });

      if (parsedCounts.mathPrompt !== 25) failures.push("prompt root count must contain exactly 25 math SVGs");
      if (parsedCounts.physicsPrompt !== 125) failures.push("prompt root count must contain exactly 125 physics SVGs");
      if (parsedCounts.physicsSolution !== 65) failures.push("solution root count must contain exactly 65 physics force SVGs");
      if (sourceEntries.length !== 215 || pairs.size !== 215) failures.push("expected 215 globally unique title/description pairs");
      return {
        failures: failures,
        counts: { mathPrompt: parsedCounts.mathPrompt, physicsPrompt: parsedCounts.physicsPrompt, physicsSolution: parsedCounts.physicsSolution, accessiblePairs: pairs.size }
      };
    }

    function waitForLayout() {
      return document.fonts.ready.then(function () {
        return new Promise(function (resolve) {
          requestAnimationFrame(function () { requestAnimationFrame(resolve); });
        });
      });
    }

    function point(matrix, x, y) {
      const transformed = new DOMPoint(x, y).matrixTransform(matrix);
      return [transformed.x, transformed.y];
    }

    function relativeMatrix(rootSvg, node) {
      return rootSvg.getScreenCTM().inverse().multiply(node.getScreenCTM());
    }

    function bboxPolygonInRoot(rootSvg, node) {
      const box = node.getBBox();
      const toRoot = relativeMatrix(rootSvg, node);
      return [
        point(toRoot, box.x, box.y), point(toRoot, box.x + box.width, box.y),
        point(toRoot, box.x + box.width, box.y + box.height), point(toRoot, box.x, box.y + box.height)
      ];
    }

    function bboxPolygonOnScreen(node) {
      const box = node.getBBox();
      const matrix = node.getScreenCTM();
      return [
        point(matrix, box.x, box.y), point(matrix, box.x + box.width, box.y),
        point(matrix, box.x + box.width, box.y + box.height), point(matrix, box.x, box.y + box.height)
      ];
    }

    function polygonAxes(polygon) {
      return polygon.map(function (current, index) {
        const next = polygon[(index + 1) % polygon.length];
        const dx = next[0] - current[0]; const dy = next[1] - current[1];
        const length = Math.hypot(dx, dy) || 1;
        return [-dy / length, dx / length];
      });
    }

    function projection(polygon, axis) {
      const values = polygon.map(function (value) { return value[0] * axis[0] + value[1] * axis[1]; });
      return [Math.min.apply(Math, values), Math.max.apply(Math, values)];
    }

    function satPenetration(first, second) {
      let penetration = Infinity;
      const axes = polygonAxes(first).concat(polygonAxes(second));
      for (const axis of axes) {
        const a = projection(first, axis); const b = projection(second, axis);
        const overlap = Math.min(a[1], b[1]) - Math.max(a[0], b[0]);
        if (overlap <= 0) return 0;
        penetration = Math.min(penetration, overlap);
      }
      return penetration;
    }

    function pointInPolygon(candidate, polygon) {
      let inside = false;
      for (let index = 0, previous = polygon.length - 1; index < polygon.length; previous = index, index += 1) {
        const a = polygon[index]; const b = polygon[previous];
        const crosses = ((a[1] > candidate[1]) !== (b[1] > candidate[1])) &&
          candidate[0] < (b[0] - a[0]) * (candidate[1] - a[1]) / (b[1] - a[1]) + a[0];
        if (crosses) inside = !inside;
      }
      return inside;
    }

    function pointSegmentDistance(candidate, a, b) {
      const dx = b[0] - a[0]; const dy = b[1] - a[1];
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared ? Math.max(0, Math.min(1, ((candidate[0] - a[0]) * dx + (candidate[1] - a[1]) * dy) / lengthSquared)) : 0;
      return Math.hypot(candidate[0] - (a[0] + t * dx), candidate[1] - (a[1] + t * dy));
    }

    function segmentDistance(a, b, c, d) {
      function orientation(p, q, r) { return (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]); }
      function onSegment(p, q, r) {
        return q[0] >= Math.min(p[0], r[0]) - 1e-9 && q[0] <= Math.max(p[0], r[0]) + 1e-9 && q[1] >= Math.min(p[1], r[1]) - 1e-9 && q[1] <= Math.max(p[1], r[1]) + 1e-9;
      }
      const oa = orientation(a, b, c); const ob = orientation(a, b, d);
      const oc = orientation(c, d, a); const od = orientation(c, d, b);
      if ((oa > 1e-9 && ob < -1e-9 || oa < -1e-9 && ob > 1e-9) && (oc > 1e-9 && od < -1e-9 || oc < -1e-9 && od > 1e-9)) return 0;
      if (Math.abs(oa) <= 1e-9 && onSegment(a, c, b)) return 0;
      if (Math.abs(ob) <= 1e-9 && onSegment(a, d, b)) return 0;
      if (Math.abs(oc) <= 1e-9 && onSegment(c, a, d)) return 0;
      if (Math.abs(od) <= 1e-9 && onSegment(c, b, d)) return 0;
      return Math.min(pointSegmentDistance(a, c, d), pointSegmentDistance(b, c, d), pointSegmentDistance(c, a, b), pointSegmentDistance(d, a, b));
    }

    function polygonSegmentDistance(polygon, a, b) {
      if (pointInPolygon(a, polygon) || pointInPolygon(b, polygon)) return 0;
      let distance = Infinity;
      polygon.forEach(function (value, index) {
        distance = Math.min(distance, segmentDistance(value, polygon[(index + 1) % polygon.length], a, b));
      });
      return distance;
    }

    function maximumMatrixScale(matrix) {
      const sum = matrix.a * matrix.a + matrix.b * matrix.b + matrix.c * matrix.c + matrix.d * matrix.d;
      const determinant = matrix.a * matrix.d - matrix.b * matrix.c;
      const discriminant = Math.max(0, sum * sum - 4 * determinant * determinant);
      return Math.sqrt((sum + Math.sqrt(discriminant)) / 2);
    }

    function screenScale(node) {
      const matrix = node.getScreenCTM();
      return Math.max(1e-9, maximumMatrixScale(matrix));
    }

    function fontScreenScale(node) {
      const matrix = node.getScreenCTM();
      return Math.hypot(matrix.c, matrix.d);
    }

    function pointsAttribute(node) {
      return Array.from(node.points || []).map(function (value) { return point(node.getScreenCTM(), value.x, value.y); });
    }

    function geometrySamples(node) {
      if (typeof node.getTotalLength !== "function" || typeof node.getPointAtLength !== "function") return [];
      const matrix = node.getScreenCTM();
      const length = node.getTotalLength();
      const samples = Math.max(1, Math.ceil(length * screenScale(node)));
      return Array.from({ length: samples + 1 }, function (_, index) {
        const local = node.getPointAtLength(length * index / samples);
        return point(matrix, local.x, local.y);
      });
    }

    function polygonEdgeProbes(polygon, spacing) {
      const probes = [];
      const maximumSpacing = spacing || 1;
      polygon.forEach(function (start, index) {
        const end = polygon[(index + 1) % polygon.length];
        const count = Math.max(1, Math.ceil(Math.hypot(end[0] - start[0], end[1] - start[1]) / maximumSpacing));
        for (let step = 0; step <= count; step += 1) {
          probes.push([start[0] + (end[0] - start[0]) * step / count, start[1] + (end[1] - start[1]) * step / count]);
        }
      });
      return probes;
    }

    function ellipseGeometry(node) {
      const tag = node.tagName.toLowerCase();
      const radius = tag === "circle" ? node.r.baseVal.value : null;
      return {
        cx: node.cx.baseVal.value,
        cy: node.cy.baseVal.value,
        rx: radius === null ? node.rx.baseVal.value : radius,
        ry: radius === null ? node.ry.baseVal.value : radius
      };
    }

    function pointInEllipse(candidate, ellipse) {
      if (!(ellipse.rx > 0) || !(ellipse.ry > 0)) return false;
      const x = (candidate[0] - ellipse.cx) / ellipse.rx;
      const y = (candidate[1] - ellipse.cy) / ellipse.ry;
      return x * x + y * y <= 1 + 1e-9;
    }

    function segmentIntersectsEllipse(start, end, ellipse) {
      if (!(ellipse.rx > 0) || !(ellipse.ry > 0)) return false;
      const x = (start[0] - ellipse.cx) / ellipse.rx;
      const y = (start[1] - ellipse.cy) / ellipse.ry;
      const dx = (end[0] - start[0]) / ellipse.rx;
      const dy = (end[1] - start[1]) / ellipse.ry;
      const a = dx * dx + dy * dy;
      const b = 2 * (x * dx + y * dy);
      const c = x * x + y * y - 1;
      if (a <= 1e-15) return Math.abs(c) <= 1e-9;
      const discriminant = b * b - 4 * a * c;
      if (discriminant < -1e-9) return false;
      const root = Math.sqrt(Math.max(0, discriminant));
      const first = (-b - root) / (2 * a); const second = (-b + root) / (2 * a);
      return first >= -1e-9 && first <= 1 + 1e-9 || second >= -1e-9 && second <= 1 + 1e-9;
    }

    function polygonCrossesEllipse(polygon, ellipse) {
      return polygon.some(function (start, index) {
        return segmentIntersectsEllipse(start, polygon[(index + 1) % polygon.length], ellipse);
      });
    }

    function ellipseOffsetBoundary(node, ellipse, offset) {
      if (!(ellipse.rx > 0) || !(ellipse.ry > 0)) return [];
      const normalSpeedBound = Math.max(ellipse.rx / ellipse.ry, ellipse.ry / ellipse.rx);
      const derivativeBound = Math.max(ellipse.rx, ellipse.ry) + Math.abs(offset) * normalSpeedBound;
      const count = Math.max(32, Math.ceil(2 * Math.PI * derivativeBound * screenScale(node) / 0.25));
      const matrix = node.getScreenCTM();
      return Array.from({ length: count + 1 }, function (_, index) {
        const angle = 2 * Math.PI * index / count;
        const cosine = Math.cos(angle); const sine = Math.sin(angle);
        const normalLength = Math.hypot(cosine / ellipse.rx, sine / ellipse.ry);
        const normalX = cosine / ellipse.rx / normalLength; const normalY = sine / ellipse.ry / normalLength;
        return point(matrix, ellipse.cx + ellipse.rx * cosine + offset * normalX, ellipse.cy + ellipse.ry * sine + offset * normalY);
      });
    }

    function ellipsePaintBoundaries(node, style) {
      const base = ellipseGeometry(node);
      const halfStroke = style.stroke === "none" ? 0 : (parseFloat(style.strokeWidth) || 0) / 2;
      if (style.stroke === "none") return style.fill === "none" ? [] : [ellipseOffsetBoundary(node, base, 0)];
      const boundaries = [ellipseOffsetBoundary(node, base, halfStroke)];
      if (style.fill === "none" && halfStroke < Math.min(base.rx, base.ry)) boundaries.push(ellipseOffsetBoundary(node, base, -halfStroke));
      return boundaries;
    }

    function screenPointInPaint(node, candidate, style) {
      const local = localScreenPoint(node, candidate);
      return (style.fill !== "none" && node.isPointInFill(local)) || (style.stroke !== "none" && node.isPointInStroke(local));
    }

    function nativePaintProbeDistance(node, polygon, style, expansion, paintBoundaries) {
      const paintPoints = paintBoundaries.flat();
      const paintX = paintPoints.map(function (value) { return value[0]; });
      const paintY = paintPoints.map(function (value) { return value[1]; });
      const paintBounds = {
        left: Math.min.apply(Math, paintX), right: Math.max.apply(Math, paintX),
        top: Math.min.apply(Math, paintY), bottom: Math.max.apply(Math, paintY)
      };
      for (const probe of polygonEdgeProbes(polygon, 0.25)) {
        if (probe[0] >= paintBounds.left - 0.25 && probe[0] <= paintBounds.right + 0.25 &&
          probe[1] >= paintBounds.top - 0.25 && probe[1] <= paintBounds.bottom + 0.25 && screenPointInPaint(node, probe, style)) return 0;
      }

      const xValues = polygon.map(function (value) { return value[0]; });
      const yValues = polygon.map(function (value) { return value[1]; });
      const left = Math.max(Math.min.apply(Math, xValues) - expansion, paintBounds.left - 0.25);
      const right = Math.min(Math.max.apply(Math, xValues) + expansion, paintBounds.right + 0.25);
      const top = Math.max(Math.min.apply(Math, yValues) - expansion, paintBounds.top - 0.25);
      const bottom = Math.min(Math.max.apply(Math, yValues) + expansion, paintBounds.bottom + 0.25);
      if (right < left || bottom < top) return Infinity;
      const columns = Math.max(1, Math.ceil((right - left) / 0.5)); const rows = Math.max(1, Math.ceil((bottom - top) / 0.5));
      let distance = Infinity;
      for (let row = 0; row <= rows; row += 1) {
        const y = top + (bottom - top) * row / rows;
        for (let column = 0; column <= columns; column += 1) {
          const x = left + (right - left) * column / columns;
          const candidate = [x, y];
          const candidateDistance = pointInPolygon(candidate, polygon) ? 0 : pointToPolygonBoundary(candidate, polygon);
          if (candidateDistance <= expansion + 1e-9 && screenPointInPaint(node, candidate, style)) {
            if (candidateDistance === 0) return 0;
            distance = Math.min(distance, candidateDistance);
          }
        }
      }
      return distance;
    }

    function ellipseDistance(node, screenPolygon, style) {
      const base = ellipseGeometry(node);
      const inverse = node.getScreenCTM().inverse();
      const localPolygon = screenPolygon.map(function (value) { return point(inverse, value[0], value[1]); });
      if (style.fill !== "none" && (localPolygon.some(function (value) { return pointInEllipse(value, base); }) ||
        pointInPolygon([base.cx, base.cy], localPolygon) || polygonCrossesEllipse(localPolygon, base))) return 0;

      let distance = Infinity;
      const paintBoundaries = ellipsePaintBoundaries(node, style);
      paintBoundaries.forEach(function (samples) {
        for (let index = 0; index + 1 < samples.length; index += 1) {
          distance = Math.min(distance, polygonSegmentDistance(screenPolygon, samples[index], samples[index + 1]));
        }
      });
      if (distance === 0) return 0;
      const halfStroke = style.stroke === "none" ? 0 : (parseFloat(style.strokeWidth) || 0) / 2;
      if (distance > Math.max(6.75, halfStroke + 0.25)) return distance;
      return Math.min(distance, nativePaintProbeDistance(node, screenPolygon, style, 6.5, paintBoundaries));
    }

    function polygonBoundaryDistance(first, second) {
      let distance = Infinity;
      first.forEach(function (a, index) {
        const b = first[(index + 1) % first.length];
        second.forEach(function (c, otherIndex) {
          distance = Math.min(distance, segmentDistance(a, b, c, second[(otherIndex + 1) % second.length]));
        });
      });
      return distance;
    }

    function localScreenPoint(node, value) {
      const local = new DOMPoint(value[0], value[1]).matrixTransform(node.getScreenCTM().inverse());
      return new DOMPoint(local.x, local.y);
    }

    function geometryDistance(node, polygon) {
      const style = getComputedStyle(node);
      const stroke = style.stroke === "none" ? 0 : (parseFloat(style.strokeWidth) || 0) * screenScale(node) / 2;
      const matrix = node.getScreenCTM();
      const tag = node.tagName.toLowerCase();
      if (tag === "circle" || tag === "ellipse") return ellipseDistance(node, polygon, style);
      if (tag === "line") {
        return Math.max(0, polygonSegmentDistance(polygon, point(matrix, node.x1.baseVal.value, node.y1.baseVal.value), point(matrix, node.x2.baseVal.value, node.y2.baseVal.value)) - stroke);
      }
      if (tag === "polyline" || tag === "polygon") {
        const points = pointsAttribute(node);
        let distance = tag === "polygon" && points.length ? polygonBoundaryDistance(polygon, points) : Infinity;
        for (let index = 0; index + 1 < points.length; index += 1) distance = Math.min(distance, polygonSegmentDistance(polygon, points[index], points[index + 1]));
        if (style.fill !== "none" && (points.some(function (value) { return pointInPolygon(value, polygon); }) || polygon.some(function (value) { return pointInPolygon(value, points); }))) distance = 0;
        return Math.max(0, distance - stroke);
      }
      if (typeof node.getTotalLength === "function" && typeof node.getPointAtLength === "function") {
        const sampled = geometrySamples(node);
        let distance = Infinity;
        for (const current of sampled) {
          if (pointInPolygon(current, polygon)) return 0;
          distance = Math.min(distance, pointToPolygonBoundary(current, polygon));
        }
        for (const probe of polygonEdgeProbes(polygon)) {
          const local = localScreenPoint(node, probe);
          if ((style.fill !== "none" && node.isPointInFill(local)) || (style.stroke !== "none" && node.isPointInStroke(local))) return 0;
        }
        return Math.max(0, distance - stroke);
      }
      return Infinity;
    }

    function polygonDistance(first, second) {
      if (first.some(function (value) { return pointInPolygon(value, second); }) || second.some(function (value) { return pointInPolygon(value, first); })) return 0;
      return polygonBoundaryDistance(first, second);
    }

    function arrowheadPolygon(node, element) {
      if (!node || !element || !element.arrowhead || !Array.isArray(element.arrowhead.points)) return [];
      const matrix = node.getScreenCTM();
      return element.arrowhead.points.map(function (value) { return point(matrix, value[0], value[1]); });
    }

    function arrowheadDistance(node, element, polygon) {
      if (!element.arrowhead || !Array.isArray(element.arrowhead.points)) return Infinity;
      const head = arrowheadPolygon(node, element);
      return polygonDistance(polygon, head);
    }

    function pointToPolygonBoundary(candidate, polygon) {
      let distance = Infinity;
      polygon.forEach(function (value, index) {
        distance = Math.min(distance, pointSegmentDistance(candidate, value, polygon[(index + 1) % polygon.length]));
      });
      return distance;
    }

    function polygonInsidePolygon(inner, outer, margin) {
      return inner.every(function (candidate) {
        const boundaryDistance = pointToPolygonBoundary(candidate, outer);
        return (pointInPolygon(candidate, outer) || boundaryDistance <= 0.01) && boundaryDistance + 0.01 >= margin;
      });
    }

    function viewBoxPolygonOnScreen(rootSvg) {
      const viewBox = rootSvg.viewBox.baseVal;
      const matrix = rootSvg.getScreenCTM();
      return [
        point(matrix, viewBox.x, viewBox.y), point(matrix, viewBox.x + viewBox.width, viewBox.y),
        point(matrix, viewBox.x + viewBox.width, viewBox.y + viewBox.height), point(matrix, viewBox.x, viewBox.y + viewBox.height)

        positive: {
          nestedTransform: JSON.stringify(firstPolygon) === JSON.stringify(expected) && JSON.stringify(secondPolygon) === JSON.stringify(expected) ? "pass" : "fail",
          cssWidth: Math.abs(widths[0] * 2 - widths[1]) < 0.01 && Math.abs(screenScale(document.getElementById("nested-rect-a")) * 2 - screenScale(document.getElementById("nested-rect-b"))) < 0.01 ? "pass" : "fail"
        },
        negative: negative
      };
    }

    async function preflightRegression() {
      const root = document.getElementById("audit-root");
      root.replaceChildren();
      const controls = [
        "subject-name", "session-state", "question-list", "status-region", "timer-display", "timer-start", "timer-pause", "timer-reset",
        "history-open", "history-dialog", "history-confirm", "submit-dialog", "submit-message", "submit-confirm", "recovery-dialog",
        "recovery-message", "recovery-continue", "recovery-new", "recovery-back", "formula-open", "formula-dialog", "formula-content",
        "formula-image", "formula-zoom-out", "formula-zoom-in", "formula-fit", "formula-zoom-output", "print-formula", "print-exam"
      ];
      const holder = document.createElement("div");
      holder.className = "audit-hidden";
      controls.forEach(function (id) {
        const tag = id.endsWith("dialog") ? "dialog" : (id === "question-list" ? "ol" : "button");
        const node = document.createElement(tag); node.id = id; holder.append(node);
      });
      const appRoot = document.createElement("main"); appRoot.id = "preflight-exam-app"; holder.append(appRoot); root.append(holder);
      const subjectId = window.KS_SUBJECT_DATA.config.id;
      const activeKey = "ks-practice:v1:" + subjectId + ":active";
      const historyKey = "ks-practice:v1:" + subjectId + ":history";
      const activeBytes = '{"sentinel":"active bytes"}';
      const historyBytes = '[{"sentinel":"history bytes"}]';
      const originalActive = localStorage.getItem(activeKey); const originalHistory = localStorage.getItem(historyKey);
      const question = window.KS_SUBJECT_DATA.slots[1][0];
      const originalManifest = question.sourceData.diagram;
      const originalPromptHtml = question.promptHtml;
      const originalRandom = Math.random;
      let randomCalls = 0;
      localStorage.setItem(activeKey, activeBytes); localStorage.setItem(historyKey, historyBytes);
      question.promptHtml = '<svg id="' + originalManifest.id + '"></svg>';
      Math.random = function () { randomCalls += 1; throw new Error("RNG must not run before diagram preflight"); };
      let result;
      try {
        result = window.KS.app.mount(appRoot, window.KS_SUBJECT_DATA);
      } finally {
        Math.random = originalRandom;
        question.sourceData.diagram = originalManifest;
        question.promptHtml = originalPromptHtml;
      }
      const disabled = ["timer-start", "timer-pause", "timer-reset", "history-open", "history-confirm", "submit-confirm", "recovery-continue", "recovery-new", "print-exam"].every(function (id) {
        return document.getElementById(id).disabled;
      });
      const outcome = result && result.ok === false && result.reason === "diagram-preflight-failed" &&
        appRoot.textContent === "Diagrammet kunde inte visas korrekt. Dina sparade svar har inte ändrats." && disabled && randomCalls === 0 &&
        localStorage.getItem(activeKey) === activeBytes && localStorage.getItem(historyKey) === historyBytes ? "pass" : "fail";
      if (originalActive === null) localStorage.removeItem(activeKey); else localStorage.setItem(activeKey, originalActive);
      if (originalHistory === null) localStorage.removeItem(historyKey); else localStorage.setItem(historyKey, originalHistory);
      holder.remove();
      return { outcome: outcome, randomCalls: randomCalls, activeBytesPreserved: outcome === "pass", historyBytesPreserved: outcome === "pass" };
    }

    window.DIAGRAM_AUDIT = {
      VIEWPORTS: VIEWPORTS,
      groups: function () { return groups().map(function (group) { return { subject: group.subject, slot: group.slot, purpose: group.purpose, count: group.questions.length }; }); },
      sourceInvariants: sourceInvariants,
      renderGroup: renderGroup,
      regressions: regressions,
      preflightRegression: preflightRegression
    };
  })();
  </script>
